name: Build Windows preview installer
on:
  workflow_dispatch:
  push:
    tags: ['v0.10.0-beta.1']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Run tests and build installer
        shell: pwsh
        run: ./Build-Windows-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VEIL-Windows-Beta-Installer
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
      - name: Create DRAFT prerelease for tagged build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/*.exe release/*.sha256 `
             --repo $env:GITHUB_REPOSITORY `
             --title "VEIL $env:GITHUB_REF_NAME — Experimental Preview" `
             --notes "UNSIGNED EXPERIMENTAL BUILD. Not independently security audited. Do not use as sole copy of important data. Keep originals and offline backups." `
             --draft --prerelease
    permissions:
      contents: write
